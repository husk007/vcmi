name: LAN Mod Sync - Linux validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lan-mod-sync-and-web-roadmap
    paths:
      - .github/workflows/lan-mod-sync-validation.yml
      - .github/lan-mod-sync-validation-trigger.txt

permissions:
  contents: read

concurrency:
  group: lan-mod-sync-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-lan-tests:
    name: Compile actual VCMI and run LAN tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out full repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -y --no-install-recommends install \
            cmake ninja-build build-essential pkg-config ccache p7zip-full xvfb xauth \
            libcurl4-openssl-dev libboost-dev libboost-filesystem-dev \
            libboost-date-time-dev libboost-program-options-dev \
            libboost-iostreams-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev qt6-base-dev qt6-svg-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            zlib1g-dev libavformat-dev libswscale-dev libtbb-dev \
            libluajit-5.1-dev libminizip-dev libsqlite3-dev \
            libsquish-dev libfmt-dev gettext

      - name: Configure VCMI with real test dependencies
        run: |
          cmake --preset linux-gcc-test \
            -DENABLE_MMAI=OFF \
            -DENABLE_DISCORD=OFF \
            -DENABLE_EDITOR=OFF \
            -DENABLE_LAUNCHER=OFF \
            -DENABLE_PCH=OFF \
            -DENABLE_STRICT_COMPILATION=OFF

      - name: Build vcmitest
        run: cmake --build --preset linux-gcc-test --target vcmitest --parallel 2

      - name: Build lobby preview client code
        run: cmake --build --preset linux-gcc-test --target vcmiclientcommon --parallel 2

      - name: Build LAN host lobby TCP code
        run: cmake --build --preset linux-gcc-test --target vcmiservercommon --parallel 2

      - name: Build real LAN host executable
        run: cmake --build --preset linux-gcc-test --target vcmiserver --parallel 2

      - name: Link complete desktop client and validate its entry point
        run: |
          cmake --build --preset linux-gcc-test --target vcmiclient --parallel 2
          out/build/linux-gcc-test/bin/vcmiclient --help > /dev/null

      - name: Stage runtime assets for vcmitest
        run: |
          # Running only the vcmitest target does not deploy the runtime assets.
          # VCMIDirs::developmentMode requires config/, Mods/ and vcmitest
          # together in the current working directory.
          test -f config/filesystem.json
          test -d Mods
          test -x out/build/linux-gcc-test/bin/vcmitest
          # CMake can already stage these assets as symlinks after the client build.
          # Copy only missing assets to avoid cp rejecting a source/destination match.
          for asset in config Mods scripts; do
            if [ ! -e "out/build/linux-gcc-test/bin/$asset" ]; then
              cp -a "$asset" out/build/linux-gcc-test/bin/
            fi
          done
          test -f out/build/linux-gcc-test/bin/config/filesystem.json

      - name: Prepare VCMI's public CI test fixture
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/vcmi-mods/vcmi-test-data/releases/download/v2.0/heroes3.7z" \
            --output "${RUNNER_TEMP}/heroes3.7z"
          mkdir -p "$HOME/.local/share/vcmi"
          7z x -y "${RUNNER_TEMP}/heroes3.7z" -o"$HOME/.local/share/vcmi"
          # A tiny locally generated mod makes the real host require an installed
          # gameplay mod that is intentionally disabled in the guest test preset.
          mkdir -p "$HOME/.local/share/vcmi/Mods/lan-ci-fixture"
          cat > "$HOME/.local/share/vcmi/Mods/lan-ci-fixture/mod.json" <<'JSON'
          {
            "name": "LAN CI installed-only fixture",
            "version": "1.0",
            "modType": "Mechanics",
            "keepDisabled": true,
            "settings": {}
          }
          JSON
          # Keep host-specific settings separate from the vcmitest guest settings.
          mkdir -p "$RUNNER_TEMP/lan-host-config/vcmi"
          cat > "$RUNNER_TEMP/lan-host-config/vcmi/modSettings.json" <<'JSON'
          {
            "activePreset": "default",
            "presets": {
              "default": {
                "mods": ["vcmi", "lan-ci-fixture"],
                "settings": {}
              }
            }
          }
          JSON

      - name: Run committed LAN tests against independent VCMI host
        working-directory: out/build/linux-gcc-test/bin
        shell: bash
        run: |
          set -euo pipefail
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          XDG_CONFIG_HOME="$RUNNER_TEMP/lan-host-config" ./vcmiserver --port "$port" > "$RUNNER_TEMP/lan-real-host.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true; wait "$host_pid" 2>/dev/null || true' EXIT
          # A disposable TCP readiness probe would shut down a host without players.
          # The integration test registers a real lobby host before previewing it.
          sleep 10
          if ! kill -0 "$host_pid" 2>/dev/null; then
            tail -n 120 "$RUNNER_TEMP/lan-real-host.log"
            exit 1
          fi
          export VCMI_LAN_TEST_SERVER_PORT="$port"
          export VCMI_LAN_TEST_REQUIRED_MOD="lan-ci-fixture"
          export VCMI_LAN_TEST_GUI_CLIENT=1
          export SDL_AUDIODRIVER=dummy
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            ./vcmitest --gtest_filter='LanModSyncTest.*' --gtest_color=no || {
            tail -n 120 "$RUNNER_TEMP/lan-real-host.log"
            exit 1
          }

      - name: Preserve configure/build logs for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lan-build-diagnostics
          path: |
            out/build/linux-gcc-test/CMakeFiles/CMakeConfigureLog.yaml
            out/build/linux-gcc-test/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
